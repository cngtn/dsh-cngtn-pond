<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Dsh-Pond-Koi">
  <!-- A koi seen from above, drawn as the glyph grid the theme uses: a pale
       body of cells, a vermilion saddle, and the dark eye. -->
  <rect width="32" height="32" rx="7" fill="#f5f4f1"/>
  <g fill="#bdb9b3">
    <rect x="11" y="14" width="3" height="3"/><rect x="14" y="11" width="3" height="3"/>
    <rect x="14" y="14" width="3" height="3"/><rect x="17" y="14" width="3" height="3"/>
    <rect x="17" y="17" width="3" height="3"/><rect x="20" y="17" width="3" height="3"/>
    <rect x="8" y="17" width="3" height="3"/><rect x="11" y="17" width="3" height="3"/>
    <rect x="11" y="20" width="3" height="3"/><rect x="14" y="20" width="3" height="3"/>
    <rect x="17" y="20" width="3" height="3"/><rect x="20" y="20" width="3" height="3"/>
    <rect x="23" y="20" width="3" height="3"/>
  </g>
  <g fill="#cc3e1c">
    <rect x="11" y="11" width="3" height="3"/><rect x="14" y="8" width="3" height="3"/>
    <rect x="17" y="11" width="3" height="3"/><rect x="20" y="14" width="3" height="3"/>
  </g>
  <rect x="14" y="5" width="3" height="3" fill="#262523"/>
  <rect x="8" y="14" width="3" height="3" fill="#262523"/>
</svg>
